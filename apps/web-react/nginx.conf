server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { return 200 "ok\n"; }

    # API requests are proxied to the backend by Istio at the mesh layer.
    # Here we just rewrite /api/* to the in-cluster ClusterIP service.
    location /api/ {
        proxy_pass http://api-node.app.svc.cluster.local:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
