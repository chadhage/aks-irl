<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SITA AKS Workshop — Storefront</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg: #f6f7fb; --fg: #1c1f2b; --accent: #2b6cb0; }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 2rem; }
    h1 { color: var(--accent); }
    .pill { display: inline-block; padding: .15rem .6rem; border-radius: 999px; background: #e2e8f0; font-size: .85rem; margin-left: .5rem; }
    .v2 { background: #fed7aa; }
    table { border-collapse: collapse; margin-top: 1rem; }
    td, th { padding: .5rem .9rem; border-bottom: 1px solid #cbd5e1; text-align: left; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Storefront <span id="version" class="pill">loading…</span> <span id="region" class="pill"></span></h1>
  <p>Backed by <code>api-node</code> — refresh to see Istio routing in action.</p>
  <div id="content">Loading products…</div>

  <script>
    async function load() {
      const out = document.getElementById('content');
      const ver = document.getElementById('version');
      const reg = document.getElementById('region');
      try {
        const r = await fetch('/api/products');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        ver.textContent = data.version;
        ver.className = 'pill ' + (data.version.startsWith('v2') ? 'v2' : '');
        reg.textContent = data.region;
        const hasRating = data.items[0] && 'rating' in data.items[0];
        out.innerHTML = '<table><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>In stock</th>' +
          (hasRating ? '<th>Rating</th>' : '') + '</tr></thead><tbody>' +
          data.items.map(i => '<tr><td>' + i.id + '</td><td>' + i.name + '</td><td>$' + i.price + '</td><td>' +
            (i.inStock ? 'yes' : 'no') + '</td>' + (hasRating ? '<td>' + i.rating + '</td>' : '') + '</tr>').join('') +
          '</tbody></table>';
      } catch (e) {
        out.innerHTML = '<p class="err">Error loading products: ' + e.message + '</p>';
      }
    }
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
