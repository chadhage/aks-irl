server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { return 200 "ok\n"; }

    # /api/* is the gateway's HTTP control plane (session list, version,
    # connection counts). The TCP/socket data plane lives on a different
    # Service (port 4561) reached directly by client endpoints.
    location /api/ {
        proxy_pass http://gateway-java.messaging.svc.cluster.local:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
