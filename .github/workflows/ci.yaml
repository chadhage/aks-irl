name: ci

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - k8s/**
      - .github/workflows/ci.yaml
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - k8s/**
  workflow_dispatch:

permissions:
  id-token: write   # for Azure OIDC
  contents: write   # so the job can bump kustomization tags

env:
  AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME:              ${{ vars.ACR_NAME }}   # e.g. sitap01acreus2a1b

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api-node, web-react, worker-python]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login -n $ACR_NAME
      - name: Build & push
        run: |
          IMG="$ACR_NAME.azurecr.io/${{ matrix.app }}"
          SHA="${GITHUB_SHA::7}"
          docker build --build-arg APP_VERSION=$SHA -t $IMG:$SHA apps/${{ matrix.app }}
          docker push $IMG:$SHA
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            docker tag  $IMG:$SHA $IMG:dev-latest
            docker push $IMG:dev-latest
          fi
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/${{ matrix.app }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'   # don't block during workshop; flip to '1' to enforce

  bump-canary:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Bump canary image tags
        run: |
          SHA="${GITHUB_SHA::7}"
          cd k8s/overlays/canary
          for app in api-node web-react worker-python; do
            sed -i "s|newTag:.*|newTag: $SHA|" kustomization.yaml || true
          done
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: bump canary to ${SHA}"
            git push
          fi

  smoke-canary:
    needs: bump-canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Soak
        run: sleep 300  # 5 min for Argo CD to sync canary
      - name: Run smoke
        env:
          TARGET_URL: ${{ vars.CANARY_URL }}
        run: ./scripts/smoke.sh

  propose-prod:
    needs: smoke-canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Open prod-bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${GITHUB_SHA::7}"
          BR="auto/prod-bump-$SHA"
          git checkout -b $BR
          cd k8s/overlays/prod
          for app in api-node web-react worker-python; do
            sed -i "s|newTag:.*|newTag: $SHA|" kustomization.yaml
          done
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: bump prod to ${SHA}"
          git push -u origin $BR
          gh pr create --title "Bump prod to $SHA" --body "Automated promotion after canary smoke passed." --base main --head $BR --label "ring:prod"
