name: ci

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - k8s/**
      - .github/workflows/ci.yaml
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - k8s/**
  workflow_dispatch:

permissions:
  id-token: write   # for Azure OIDC
  contents: write   # so the job can bump kustomization tags
  pull-requests: write

env:
  AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME:              ${{ vars.ACR_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [gateway-java, parser-cpp, ops-console]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login -n "$ACR_NAME"
      - name: Build & push
        id: image
        run: |
          IMG="${ACR_NAME}.azurecr.io/${{ matrix.app }}"
          SHA="${GITHUB_SHA::7}"
          docker build --build-arg "APP_VERSION=$SHA" -t "${IMG}:${SHA}" "apps/${{ matrix.app }}"
          docker push "${IMG}:${SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            docker tag "${IMG}:${SHA}" "${IMG}:dev-latest"
            docker push "${IMG}:dev-latest"
          fi
          echo "ref=${IMG}:${SHA}" >> "$GITHUB_OUTPUT"
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  bump-canary:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump canary image tags
        run: |
          SHA="${GITHUB_SHA::7}"
          cd k8s/overlays/canary
          sed -i "s|newTag:.*|newTag: $SHA|" kustomization.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: bump canary to ${SHA}"
            git push
          fi

  smoke-canary:
    needs: bump-canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ncat
        run: sudo apt-get update && sudo apt-get install -y ncat
      - name: Wait for Argo sync
        run: sleep 300
      - name: Socket-soak smoke test
        env:
          NLB_IP: ${{ vars.CANARY_NLB_IP }}
          NLB_PORT: "4561"
        run: ./scripts/smoke.sh tcp "$NLB_IP" "$NLB_PORT" 200 --duration 60s

  propose-prod:
    needs: smoke-canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open prod-bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${GITHUB_SHA::7}"
          BR="auto/prod-bump-$SHA"
          git checkout -b "$BR"
          cd k8s/overlays/prod
          sed -i "s|newTag:.*|newTag: $SHA|" kustomization.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: bump prod to ${SHA}"
          git push -u origin "$BR"
          gh pr create \
            --title "Bump prod to $SHA" \
            --body "Automated promotion after canary socket-soak passed." \
            --base main --head "$BR" --label "ring:prod"
