apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ring-canary
  namespace: argocd
spec:
  project: messaging
  source:
    repoURL: https://github.com/REPLACE/aks-briefing-with-labs.git
    targetRevision: HEAD
    path: k8s/overlays/canary
  destination:
    server: https://kubernetes.default.svc
    namespace: messaging-canary
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
