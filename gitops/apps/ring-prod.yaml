# Prod ring — auto-sync DISABLED to require human approval.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ring-prod
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: messaging-prod
spec:
  project: messaging
  source:
    repoURL: https://github.com/REPLACE/aks-briefing-with-labs.git
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: messaging-prod
  syncPolicy:
    # NOTE: automated.* intentionally omitted — manual sync only.
    syncOptions: [CreateNamespace=true]
