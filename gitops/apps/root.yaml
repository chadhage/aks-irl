apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: messaging-root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: messaging
  source:
    repoURL: https://github.com/REPLACE/aks-briefing-with-labs.git
    targetRevision: HEAD
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
