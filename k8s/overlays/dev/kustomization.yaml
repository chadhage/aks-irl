# Dev ring — small replicas, latest images, no traffic gates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-dev
resources:
  - ../../base
patches:
  - target: { kind: Namespace, name: app }
    patch: |
      - op: replace
        path: /metadata/name
        value: app-dev
  - target: { kind: Deployment, name: api-node }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: web-react }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
images:
  - name: ghcr.io/REPLACE/api-node
    newTag: dev-latest
  - name: ghcr.io/REPLACE/web-react
    newTag: dev-latest
  - name: ghcr.io/REPLACE/worker-python
    newTag: dev-latest
