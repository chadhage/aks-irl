# Canary ring — production-sized but lower replica count, image pinned by tag.
# Module 05 promotes from dev by bumping these tags via a PR-driven GH Action.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: messaging-canary
resources:
  - ../../base
patches:
  - target: { kind: Namespace, name: messaging }
    patch: |
      - op: replace
        path: /metadata/name
        value: messaging-canary
  - target: { kind: StatefulSet, name: gateway-java }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
images:
  - name: REPLACE_ACR/gateway-java
    newTag: REPLACE_CANARY_TAG
  - name: REPLACE_ACR/parser-cpp
    newTag: REPLACE_CANARY_TAG
  - name: REPLACE_ACR/ops-console
    newTag: REPLACE_CANARY_TAG
