# Canary ring — production-sized but lower replica count, image pinned by tag.
# Module 05 promotes from dev by bumping these tags via a PR-driven GH Action.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-canary
resources:
  - ../../base
patches:
  - target: { kind: Namespace, name: app }
    patch: |
      - op: replace
        path: /metadata/name
        value: app-canary
  - target: { kind: Deployment, name: api-node }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
images:
  - name: ghcr.io/REPLACE/api-node
    newTag: REPLACE_CANARY_TAG
  - name: ghcr.io/REPLACE/web-react
    newTag: REPLACE_CANARY_TAG
  - name: ghcr.io/REPLACE/worker-python
    newTag: REPLACE_CANARY_TAG
