# Prod ring — full replica counts, image tag promoted from canary via gated PR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: messaging-prod
resources:
  - ../../base
patches:
  - target: { kind: Namespace, name: messaging }
    patch: |
      - op: replace
        path: /metadata/name
        value: messaging-prod
  - target: { kind: StatefulSet, name: gateway-java }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
  - target: { kind: Deployment, name: parser-cpp }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
  - target: { kind: Deployment, name: ops-console }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
images:
  - name: REPLACE_ACR/gateway-java
    newTag: REPLACE_PROD_TAG
  - name: REPLACE_ACR/parser-cpp
    newTag: REPLACE_PROD_TAG
  - name: REPLACE_ACR/ops-console
    newTag: REPLACE_PROD_TAG
