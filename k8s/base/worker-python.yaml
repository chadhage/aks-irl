apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-python
  namespace: app
  labels: { app: worker-python }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker-python }
  template:
    metadata:
      labels: { app: worker-python }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 60   # let SIGTERM drain
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/REPLACE/worker-python:v1
          env:
            - name: APP_VERSION
              value: v1
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
