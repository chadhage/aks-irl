apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-react
  namespace: app
  labels: { app: web-react }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web-react }
  template:
    metadata:
      labels: { app: web-react }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/REPLACE/web-react:v1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # nginx writes /var/cache/nginx
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: web-react
  namespace: app
spec:
  selector: { app: web-react }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-react
  namespace: app
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: web-react }
