# ops-console: HTTP-only React-style operator console. Fronted by Front Door.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console
  namespace: messaging
  labels: { app: ops-console, tier: control-plane }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ops-console }
  template:
    metadata:
      labels: { app: ops-console, tier: control-plane }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: REPLACE_ACR/ops-console:v1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # nginx writes /var/cache/nginx
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: ops-console
  namespace: messaging
spec:
  selector: { app: ops-console }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ops-console
  namespace: messaging
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ops-console }
