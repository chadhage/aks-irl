# Istio routing for the messaging stack.
# - ops-console (HTTP) is fronted by Front Door via the external ingress gateway.
# - TCP data plane (sockets) reaches gateway-java directly through the Azure
#   NLB created by the gateway-java-tcp Service; mTLS Pod-to-Pod for the
#   gateway → parser leg lives inside the mesh.
# Module 04 layers parser-cpp v2 and shifts gateway→parser traffic via this
# VirtualService.

apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: ops-console-gw
  namespace: messaging
spec:
  selector:
    istio: aks-istio-ingressgateway-external
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts: ["*"]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ops-console
  namespace: messaging
spec:
  hosts: ["*"]
  gateways: [ops-console-gw]
  http:
    - match: [ { uri: { prefix: "/" } } ]
      route:
        - destination: { host: ops-console, port: { number: 8080 } }
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: parser-cpp
  namespace: messaging
spec:
  hosts: ["parser-cpp.messaging.svc.cluster.local"]
  http:
    - route:
        - destination: { host: parser-cpp, subset: v1, port: { number: 9100 } }
          weight: 100
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: parser-cpp
  namespace: messaging
spec:
  host: parser-cpp
  trafficPolicy:
    connectionPool:
      tcp: { maxConnections: 200 }
      http: { http2MaxRequests: 2000, maxRequestsPerConnection: 50 }
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels: { version: v1 }
    - name: v2
      labels: { version: v2 }
